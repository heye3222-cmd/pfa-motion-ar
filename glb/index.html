<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLB 테스트</title>
<!-- 접수용 GLB(모션포스터_AR_3D_빛과그림자_입체각도.glb)를 휴대폰에서 확인하는 페이지
     화면: 손가락으로 돌려 각도별 문구 변화 확인, 시작 장면(한 번) -> 밝은 반복 순서 재생
     AR 보기: 안드로이드 = Scene Viewer / WebXR, 아이폰 = Quick Look. 벽에 붙여 놓음(ar-placement="wall")
     ※ AR 보기에서는 휴대폰 앱이 애니메이션을 정함(보통 0번 밝은 반복) -> 관리자 앱과 비슷한 상황 -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>
<style>
  :root { --bg: #e9e8e4; --ink: #1d1d1b; --sub: #6b6a66; --btn: #fff; --line: #cfcdc7; --on: #1d1d1b; --onInk: #fff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1b1b1a; --ink: #f1f0ec; --sub: #a3a29d; --btn: #2a2a28; --line: #3b3b38; --on: #f1f0ec; --onInk: #1b1b1a; }
  }
  :root[data-theme="dark"] { --bg: #1b1b1a; --ink: #f1f0ec; --sub: #a3a29d; --btn: #2a2a28; --line: #3b3b38; --on: #f1f0ec; --onInk: #1b1b1a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  body { display: flex; flex-direction: column; }
  model-viewer { flex: 1; width: 100%; min-height: 0; background: #e9e8e4; --poster-color: #e9e8e4; }
  #panel { padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
  .row b { font-weight: 600; font-size: 12px; color: var(--sub); width: 100%; }
  button { appearance: none; border: 1px solid var(--line); background: var(--btn); color: var(--ink); border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 13px; }
  button.on { background: var(--on); color: var(--onInk); border-color: var(--on); }
  #status { font-size: 12px; color: var(--sub); }
  #arBtn { position: absolute; right: 16px; bottom: 16px; background: #1d1d1b; color: #fff; border: 0; padding: 10px 16px; font-weight: 600; }
</style>
</head>
<body>
<model-viewer id="mv" src="model.glb" alt="PFA 모션포스터 GLB"
  ar ar-modes="webxr scene-viewer quick-look" ar-placement="wall"
  camera-controls touch-action="pan-y" camera-orbit="0deg 90deg auto" camera-target="0m 0m 0m" field-of-view="40deg"
  min-camera-orbit="-70deg 20deg auto" max-camera-orbit="70deg 160deg auto"
  interaction-prompt="none" shadow-intensity="0" exposure="1" animation-name="Bright_Loop_10s" autoplay>
  <button slot="ar-button" id="arBtn">AR로 보기 (벽에 붙이기)</button>
</model-viewer>
<div id="panel">
  <div class="row"><b>재생</b>
    <button id="playIntro">시작 장면 → 밝은 반복</button>
    <button id="playLoop" class="on">밝은 반복만 (0번)</button>
    <span id="status"></span>
  </div>
  <div class="row"><b>보는 각도 (손가락으로 직접 돌려도 됨)</b>
    <button data-orbit="0deg 90deg" class="on">정면</button>
    <button data-orbit="0deg 65deg">위에서 25°</button>
    <button data-orbit="0deg 115deg">아래에서 25°</button>
    <button data-orbit="-25deg 90deg">왼쪽 25°</button>
    <button data-orbit="25deg 90deg">오른쪽 25°</button>
  </div>
</div>
<script type="module">
  const mv = document.getElementById('mv');
  const status = document.getElementById('status');
  const LOOP = 'Bright_Loop_10s', INTRO = 'Intro_DarkToLight_once';
  const setOn = (sel, el) => document.querySelectorAll(sel).forEach((b) => b.classList.toggle('on', b === el));

  // 시작 장면은 한 번만, 끝나면 밝은 반복으로 (관리자 앱이 이렇게 해 줄 수 있으면 실제 전시에서도 같은 모습)
  function playLoop() {
    mv.animationName = LOOP; mv.currentTime = 0; mv.play();
    status.textContent = '0번 밝은 반복';
    setOn('[id^=play]', document.getElementById('playLoop'));
  }
  // 시작 장면 끝(또는 처음으로 되감기는 순간)을 매 프레임 지켜보다가 밝은 반복으로 넘김 (시작 장면 끝 = 밝은 반복 첫 장면과 같아 끊김 없음)
  let watch = 0;
  function playIntro() {
    cancelAnimationFrame(watch);
    mv.animationName = INTRO; mv.currentTime = 0; mv.play();
    status.textContent = '1번 시작 장면 (한 번)';
    setOn('[id^=play]', document.getElementById('playIntro'));
    let prev = 0;
    const tick = () => {
      if (mv.animationName !== INTRO) return;
      const t = mv.currentTime;
      if (t >= mv.duration - 0.06 || t < prev - 0.5) { playLoop(); return; }
      prev = t; watch = requestAnimationFrame(tick);
    };
    watch = requestAnimationFrame(tick);
  }
  mv.addEventListener('load', () => { status.textContent = '불러옴 · 애니메이션 ' + mv.availableAnimations.join(', '); });
  document.getElementById('playIntro').onclick = playIntro;
  document.getElementById('playLoop').onclick = playLoop;

  document.querySelectorAll('[data-orbit]').forEach((b) => b.onclick = () => {
    mv.cameraOrbit = b.dataset.orbit + ' auto';
    setOn('[data-orbit]', b);
  });
  mv.addEventListener('camera-change', (e) => { if (e.detail.source === 'user-interaction') setOn('[data-orbit]', null); });
</script>
</body>
</html>
