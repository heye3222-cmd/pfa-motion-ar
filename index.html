<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모션포스터 실시간 AR</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-v1.5.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  /* 포스터 톤(회색 벽, 검정 그림자)을 따르는 얇은 안내 */
  :root { --ink: #0d0d0e; --wall: #c9c9c7; --text: #f2f2f0; --muted: #a3a3a0; --veil: rgba(13,13,14,.72); color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); overflow: hidden; touch-action: none;
               font: 15px/1.5 "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  [hidden] { display: none !important; }
  html.running, html.running body { background: transparent; }  /* AR: 카메라 영상(z-index -2)이 보이도록 */
  html.web, html.web body { background: #fff; }   /* 화면 보기: 흰 벽 위에 걸린 것처럼 -> 포스터 밖 그늘·그림자가 보임 */
  a-scene { position: fixed; inset: 0; }
  .layer { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; pointer-events: none;
           padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }

  #start { background: var(--ink); pointer-events: auto; }
  #start .box { display: grid; gap: 18px; justify-items: center; text-align: center; max-width: 320px; }
  #start .mark { display: grid; grid-template-columns: repeat(3, 34px); gap: 6px; }
  #start .mark i { height: 30px; background: repeating-linear-gradient(var(--text) 0 4px, transparent 4px 8.5px); }
  #start h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .01em; }
  #start p { margin: 0; color: var(--muted); font-size: 14px; }
  #start .btns { display: grid; gap: 10px; width: 100%; }
  .btn { pointer-events: auto; font: inherit; font-weight: 600; border-radius: 999px; padding: 13px 30px; cursor: pointer; border: 0; }
  .btn.primary { color: var(--ink); background: var(--text); }
  .btn.ghost { color: var(--text); background: transparent; box-shadow: inset 0 0 0 1px rgba(242,242,240,.35); }
  .btn:focus-visible { outline: 2px solid var(--wall); outline-offset: 3px; }
  .btn[disabled] { opacity: .5; }

  #scan .frame { width: min(68vw, 52vh); aspect-ratio: 594 / 841; position: relative; }
  #scan .frame i { position: absolute; width: 16%; aspect-ratio: 1; border: 2px solid var(--text); opacity: .9; }
  #scan .frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }
  #scan .frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
  #scan .frame i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; }
  #scan .frame i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  @media (prefers-reduced-motion: no-preference) {
    #scan .frame { animation: breathe 1.6s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(.96); opacity: .6; } }
  }
  .pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(28px + env(safe-area-inset-bottom, 0px));
          z-index: 11; background: var(--veil); color: var(--text); padding: 8px 16px; border-radius: 999px;
          font-size: 13px; white-space: nowrap; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .pill b { font-weight: 600; }

  /* 각도 눈금 (?debug=1): 왼쪽 끝 = 시작(어둠), 가운데 = 밝음, 오른쪽 끝 = 끝(어둠 + 심볼) */
  #meter { position: fixed; left: 50%; transform: translateX(-50%); top: calc(16px + env(safe-area-inset-top, 0px)); z-index: 11;
           width: min(320px, calc(100vw - 32px)); display: grid; gap: 6px; background: var(--veil); padding: 10px 12px;
           border-radius: 12px; font-size: 12px; color: var(--muted); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #meter .bar { position: relative; height: 6px; border-radius: 3px;
                background: linear-gradient(90deg, #000, #888 30%, var(--wall) 50%, #888 70%, #000); }
  #meter .bar i { position: absolute; top: -4px; width: 2px; height: 14px; background: var(--text); left: 50%; }
  #meter .row { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }

  #err { background: var(--ink); pointer-events: auto; text-align: center; }
  #err p { max-width: 300px; margin: 0; color: var(--muted); }
  #err strong { display: block; color: var(--text); margin-bottom: 8px; font-size: 16px; }
</style>
</head>
<body>

<div class="layer" id="start">
  <div class="box">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>PROCESS FACTORY AUTOMATION</h1>
    <p id="intro">포스터 앞에서 좌우나 위아래로 비켜서면 빛이 들어오고 빠집니다. 정면에서 가장 밝고, 비켜설수록 어둠에 잠깁니다.</p>
    <div class="btns">
      <button class="btn primary" id="goAR" type="button" disabled>불러오는 중…</button>
      <button class="btn ghost" id="goWeb" type="button" disabled>화면으로 보기</button>
    </div>
  </div>
</div>

<div class="layer" id="scan" hidden>
  <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</div>
<div class="pill" id="pill" hidden>포스터 전체가 화면에 들어오게 비춰 주세요</div>

<div id="meter" hidden>
  <div class="row"><span>왼쪽·위 · 시작</span><span id="meterVal">0°</span><span>오른쪽·아래 · 끝</span></div>
  <div class="bar"><i id="meterKnob"></i></div>
</div>

<div class="layer" id="err" hidden>
  <p><strong>카메라를 열 수 없습니다</strong><span id="errMsg">브라우저 설정에서 이 페이지의 카메라 권한을 허용한 뒤 새로고침해 주세요.</span></p>
</div>

<a-scene id="scene"
  mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0005; filterBeta: 300; warmupTolerance: 3; missTolerance: 8"
  renderer="colorManagement: true; physicallyCorrectLights: false; antialias: true"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
  <a-camera id="cam" position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <!-- 포스터 폭 = 1, 높이 = 3000/2120 (A1). 판은 사방 0.06씩 더 커서 어두울 때 그늘이 벽으로 번진다.
         모션은 아래 셰이더가 포스터 이미지로 매 프레임 그린다 -->
    <a-plane id="motionPlane" width="1.12" height="1.5351" position="0 0 0"></a-plane>
  </a-entity>
</a-scene>

<!-- 모션 셰이더: After Effects 확정 모션(Poster_Fadeout_C15_고해상도)의 레이어를 한 장면으로 계산한다.
     좌표 p = 포스터 위 위치 (x: 왼->오 0~1, y: 위->아래 0~1). 길이는 포스터 폭 기준(W 단위). -->
<script id="motionFrag" type="x-shader/x-fragment">
  precision highp float;
  uniform sampler2D uPoster, uSymbol;
  uniform vec2 uTexSize;          // 2120, 3000
  uniform float uA;               // 높이/폭 = 1.4151
  uniform vec4 uLight;            // 빛 타원 중심, 반지름 (지나가는 방향 길이 / 그 수직 길이 대비)
  uniform vec2 uLight2;           // 타원 경계 부드러움, 하이라이트 반지름 (W 단위)
  uniform vec2 uSweep;            // 빛·어둠이 지나가는 방향 (시작 쪽 -> 끝 쪽). 좌우 = (1,0), 위아래 = (0,1)
  uniform float uStretch, uSoft, uDir;   // 그림자 길이 배율, 오른쪽으로 커지는 블러, 방향 블러 (포스터 높이 대비)
  uniform float uShear, uStretchMul;     // 보는 방향에 따른 그림자 기울기 (위에서 보면 +: 아래로 기욺), 비켜설수록 길어지는 배율
  uniform float uOcc, uSymEdge;   // 오른쪽에서 들어오는 가림 띠 위치 (심볼용은 0.3초 늦음)
  uniform float uLevel;           // 마지막 암전 (1 -> 0)
  uniform float uSymA, uTailA, uSymScale;
  uniform float uAmbGain, uOpacity;
  uniform float uSettle;          // 빛이 들어오는 동안 1 -> 0: 빛이 막 닿은 곳의 그림자가 길고 흐리다가 제자리로
  uniform float uIntensity;       // 빛 세기 (들어오며 조금씩 차오름 + 아주 느린 숨쉬기)
  uniform vec2 uDrift;            // 광원의 아주 작은 흔들림 (가만히 있어도 살아 있게)
  uniform float uWarm;            // 빛 경계의 따뜻한 기운 (0 = 끔)
  uniform float uM;               // 판이 포스터보다 사방으로 큰 폭 (W 단위). 바깥은 어두울 때만 벽으로 번지는 그늘
  varying vec2 vUv;

  const float X0 = 0.09;          // 왼쪽 세로 텍스트 열 경계 = 그림자가 늘어나는 기준선
  const float BAND = 1.5;         // 가림 띠 경계 폭 (영상 실측: 포스터 폭의 1.5배에 걸쳐 고르게 번짐)
  const float AMB = 0.2;          // 가려진 벽 톤 (영상 실측 밝기 48~50 / 255, 거의 평평)

  float band(float edge, float x) { return clamp((edge - (1.0 - x)) / BAND + 0.5, 0.0, 1.0); }

  float lodAuto(vec2 uv) {
    vec2 t = uv * uTexSize;
    return log2(max(max(length(dFdx(t)), length(dFdy(t))), 1.0));
  }
  vec3 tex(vec2 p, float lod) { return textureLod(uPoster, vec2(p.x, 1.0 - p.y), lod).rgb; }

  // 인쇄본 왼쪽 아래 로고 자리는 바로 위 빈 종이로 덮는다 (영상과 같게)
  vec3 poster(vec2 p, float lod) {
    vec2 lo = vec2(60.0, 2872.0) / uTexSize, hi = vec2(440.0, 2958.0) / uTexSize, f = vec2(14.0) / uTexSize;
    vec2 m2 = smoothstep(lo - f, lo + f, p) * (1.0 - smoothstep(hi - f, hi + f, p));
    float m = m2.x * m2.y;
    vec3 c = tex(p, lod);
    return m > 0.0 ? mix(c, tex(p - vec2(0.0, 100.0 / uTexSize.y), lod), m) : c;
  }

  // 지나가는 방향으로 본 위치 (0 = 시작 쪽 가장자리, 1 = 끝 쪽 가장자리)
  float sweepU(vec2 p) {
    float L = uSweep.x + uA * uSweep.y;
    return dot(vec2(p.x - 0.5, (p.y - 0.5) * uA), uSweep) / L + 0.5;
  }
  // 어둠 경계가 곧은 선이 아니라 부드럽게 일렁이도록. 경계가 움직이면 결도 같이 흐른다
  float wobble(float y, float edge) {
    return 0.035 * sin(y * 7.0 + edge * 5.0) + 0.018 * sin(y * 17.0 - edge * 3.0 + 1.3);
  }
  float hash(float n) { return fract(sin(n * 91.345) * 47453.21); }
  // 문구 잉크 (종이보다 어두운 정도). 왼쪽 문구 열 안에서만
  float inkAt(vec2 s, float lod) {
    if (s.x < 0.0 || s.x > X0 || s.y < 0.0 || s.y > 1.0) return 0.0;
    float c = tex(s, lod).r, paper = tex(s, log2(0.02 * uTexSize.y)).r;
    return clamp((paper - c) / max(paper, 0.05) * 1.4, 0.0, 1.0);
  }
  // 그림자처럼 끌리며 사라지는 문구: 보는 방향(빛 반대쪽)으로 꼬리가 길어지고, 길어질수록 잉크가 옅어지고 번짐
  float textTrail(vec2 p, float q, float lod) {
    vec2 off = uSweep * (0.16 * q) / vec2(1.0, uA);
    float acc = 0.0, wsum = 0.0;
    for (int i = 0; i < 8; i++) {
      float f = float(i) / 7.0, w = 1.0 - 0.7 * f;
      acc += inkAt(p - off * f, lod + 1.5 * q * f) * w;
      wsum += w;
    }
    return acc / wsum * (1.0 - 0.35 * q);
  }
  float textSink(float id, float cell, float x) {
    float uc = sweepU(vec2(x, (id + 0.5) * cell));
    float q = clamp((uOcc - 0.15 - 0.2 * hash(id) - (1.0 - uc)) / 0.45 + 0.5, 0.0, 1.0);
    return q * q * (3.0 - 2.0 * q);
  }

  void main() {
    vec2 pw = vec2(vUv.x * (1.0 + 2.0 * uM) - uM, (1.0 - vUv.y) * (uA + 2.0 * uM) - uM);
    float outside = max(max(-pw.x, pw.x - 1.0), max(-pw.y, pw.y - uA));   // > 0 이면 포스터 바깥 (W 단위 거리)
    vec2 p = clamp(vec2(pw.x, pw.y / uA), 0.0, 1.0);
    vec2 P = vec2(p.x, p.y * uA);
    float base = lodAuto(p);

    // 지나가는 방향 좌표계: S.x = 시작 쪽 가장자리부터의 거리 (0~L), S.y = 그 수직 방향 (0~Lp). 좌우일 때 S = P
    vec2 Dp = vec2(-uSweep.y, uSweep.x);
    float L = uSweep.x + uA * uSweep.y, Lp = abs(Dp.x) + uA * abs(Dp.y);
    vec2 Pc = P - vec2(0.5, 0.5 * uA);
    vec2 S = vec2(dot(Pc, uSweep) + 0.5 * L, dot(Pc, Dp) + 0.5 * Lp);
    float u = S.x / L;
    bool inCol = p.x < X0;
    bool inText = inCol || (p.y > 0.955 && p.x < 0.20);

    // 오른쪽(또는 아래)에서 오는 어둠의 정도. 경계는 일렁임
    float occW = band(uOcc, u + wobble(S.y, uOcc));

    // 빛(직사광): 타원 안쪽 + 그 앞으로 길게 번지는 옅은 빛. 벽에 실제로 빛이 닿을 때처럼 경계가 한 줄로 끊기지 않게
    vec2 c = uLight.xy * vec2(L, Lp) + uDrift * L;
    vec2 d = S - c;
    float k = length(d / (uLight.zw * vec2(L, Lp)));
    float dist = length(d) * (1.0 - 1.0 / max(k, 1e-4));
    float F = uLight2.x * L;
    float core = 1.0 - smoothstep(-F * 0.5, F * 0.5, dist);
    float glow = 1.0 - smoothstep(-F * 0.3, F * 1.8, dist);
    float halo = (1.0 - core) * glow * 0.12;          // 빛이 오기 전 벽 가장자리가 희미하게 밝아지는 정도
    float m = core + halo;

    // 문구(왼쪽 세로 글자열): 어둠이 오는 순서대로 글자 몇 개 높이(4.5%)씩, 벽보다 조금 늦게
    //   큰 글자 그림자처럼 보는 방향으로 꼬리가 끌리며 옅어져 사라짐 (좌우로 보면 오른쪽으로, 위아래로 보면 아래로 끌림)
    //   qT = 사라지는 정도 (덩어리마다 살짝 다른 시점, 경계는 이웃과 섞어 계단이 안 보이게), qC = 종이 톤 (끊김 없이)
    //   꼬리는 문구 열 밖 벽까지 이어지므로 열 오른쪽 일부도 함께 계산
    float qT = 0.0, qC = 0.0;
    bool nearCol = p.x < X0 + 0.16 * uSweep.x + 1e-3;
    if (nearCol) {
      float cell = 0.045, id = floor(p.y / cell), f = fract(p.y / cell), xc = min(p.x, 0.045);
      float qa = textSink(id - 1.0, cell, xc), qb = textSink(id, cell, xc), qc = textSink(id + 1.0, cell, xc);
      qT = mix(qb, (qb + qc) * 0.5, smoothstep(0.7, 1.0, f));
      qT = mix(qT, (qa + qb) * 0.5, smoothstep(0.3, 0.0, f));
      qC = clamp((uOcc - 0.25 - (1.0 - sweepU(p))) / 0.6 + 0.5, 0.0, 1.0);
    }

    // 1) 포스터: 문구는 제자리, 그림자는 기준선에서 늘어나며 번짐
    vec3 col;
    if (inText) {
      col = poster(p, base);
      if (inCol && qT > 0.001) {
        vec3 paper = poster(p, base + 5.0);
        col = mix(col, paper * (1.0 - textTrail(p, qT, base)), smoothstep(0.0, 0.15, qT));
      }
    } else {
      float map = clamp((p.x - X0) / (1.0 - X0), 0.0, 1.0);
      // 어둠 바로 앞: 그림자가 먼저 길게 끌려가며 번짐
      float lead = clamp((uOcc + 0.3 - (1.0 - u)) / 0.6 + 0.5, 0.0, 1.0);   // 어둠보다 조금 앞서 가는 좁은 띠
      float pre = (1.0 - smoothstep(0.25, 0.75, occW)) * smoothstep(0.0, 0.6, lead);
      // 빛이 막 닿은 곳: 낮게 스치는 빛이라 그림자가 길고 흐림 -> 빛이 차오르면 짧아지며 또렷하게 자리 잡음
      float settle = uSettle * (1.0 - smoothstep(0.15, 0.9, m));
      float s = uStretch * uStretchMul * (1.0 + 0.45 * pre + 0.35 * settle);
      float xs = X0 + (p.x - X0) / s;
      // 그림자 기울기: 기준선에서 멀어질수록 위/아래로 (AE Corner Pin 기울기와 같은 식)
      vec2 q = vec2(xs, p.y - uShear * (xs - X0) / uA);
      float lod = max(base, log2(1.0 + (uSoft * map + 0.012 * pre + 0.01 * settle) * uTexSize.y * 0.7));
      vec2 dir = normalize(vec2(1.0, uShear / uA));
      float spread = (uDir + 0.03 * pre + 0.02 * settle) * uA;   // 방향 블러 길이 (그림자 방향, W 단위)
      col = vec3(0.0);
      for (int i = 0; i < 7; i++) {
        vec2 o = dir * (float(i) / 6.0 - 0.5) * spread;
        col += poster(vec2(max(q.x + o.x, X0), q.y + o.y), lod);
      }
      col /= 7.0;
    }

    // 1-0) 문구 꼬리가 열 밖 벽으로 이어지는 부분
    if (!inText && nearCol && qT > 0.001) col *= 1.0 - 0.9 * textTrail(p, qT, base);

    // 1-1) 빛이 약한 곳은 그림자 대비도 약함: 그림자가 빛과 함께 또렷해짐
    float wallTone = tex(p, log2(0.02 * uTexSize.y)).r;
    col = mix(vec3(wallTone), col, 0.3 + 0.7 * smoothstep(0.05, 0.75, m));

    // 2) 광원 쪽 하이라이트 (스크린 30%)
    float ramp = 1.0 - clamp(length(S - c) / (uLight2.y * L), 0.0, 1.0);
    col = 1.0 - (1.0 - col) * (1.0 - 0.3 * ramp);

    // 2-1) 어둠 경계의 반그림자: 닿기 직전 그림자 대비가 먼저 풀리며 옅은 회색 막이 낌

    // 3) 가림 띠: 직사광이 가려지고 환경광만 받는 벽 (그림자 톤이 벽 전체로 퍼짐)
    float occ = inCol ? max(qC, occW * 0.4) : occW;

        amb = col * 0.55;                           // 문구는 번진 채 종이 톤으로 가라앉음 (영상 실측 0.55)
      } else {

    float lightF = (pow(core, 0.6) + halo) * uIntensity;
    col *= lightF;
    col *= mix(vec3(1.0), vec3(1.06, 1.0, 0.9), 4.0 * m * (1.0 - m) * uWarm);   // 빛 경계만 아주 살짝 따뜻하게

    // 5) 마지막 암전
    col *= uLevel;

    // 포스터 밖: 포스터가 어두운 만큼만 벽 쪽으로 옅은 그늘이 번짐 (밝을 땐 투명 -> 실제 벽이 그대로 보임)
    if (outside > 0.0) {
      float lit = clamp(lightF * uLevel * (1.0 - 0.75 * occ), 0.0, 1.0);
      float spill = (1.0 - lit) * (1.0 - smoothstep(0.0, uM, outside)) * 0.8;
      // 빛을 받는 동안 포스터가 벽에서 살짝 떠 있는 것처럼: 빛이 오는 반대쪽 벽에 옅고 부드러운 그림자
      vec2 sq = pw - uSweep * 0.022;

    }

    // 6) 가운데 심볼 (암전 위에 남음): 가림 띠를 따라 오른쪽부터 드러나고, 다음 바퀴 시작에 천천히 사라짐
    vec2 sz = vec2(0.28, 0.28 * 66.0 / 246.0) * uSymScale;
    vec2 su = (P - vec2(0.5, 0.5 * uA)) / sz + 0.5;
    if (su.x > 0.0 && su.x < 1.0 && su.y > 0.0 && su.y < 1.0) {

      float sm = band(uSymEdge, u);
      col = mix(col, vec3(1.0), a * clamp(uSymA * sm + uTailA, 0.0, 1.0));

</script>
<script id="motionVert" type="x-shader/x-vertex">
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
</script>

<!-- 빛 속 먼지: 포스터 앞 공간(포스터 폭의 1.5~32%)에 떠 있는 먼지. 포스터 위 같은 자리에 빛이 닿을 때만 은은하게 반짝인다 -->
<script id="dustVert" type="x-shader/x-vertex">
  attribute float aSeed;
  uniform float uTime, uA, uOcc, uLevel, uIntensity, uOpacity, uPx;
  uniform vec4 uLight;
  uniform vec2 uLight2, uSweep, uDrift, uStir;
  varying float vA;
  void main() {
    vec3 p = position;
    float s = aSeed, t = uTime;
    // 공기 중에서 아주 느리게 맴돎
    p.x += 0.03 * sin(t * (0.11 + 0.07 * s) + s * 40.0);
    p.y += 0.035 * sin(t * (0.09 + 0.05 * fract(s * 7.0)) + s * 17.0);
    p.z += 0.015 * sin(t * 0.13 + s * 9.0);
    // 휴대폰을 빨리 움직이면 공기가 흔들리듯 살짝 휘날림 (앞쪽 먼지일수록 크게)
    p.xy += uStir * (0.4 + 0.6 * fract(s * 3.7)) * (0.5 + p.z * 3.0);

    // 이 먼지 바로 뒤 포스터 지점의 빛 (모션 셰이더와 같은 계산)
    vec2 P = vec2(p.x + 0.5, 0.5 * uA - p.y);
    vec2 Dp = vec2(-uSweep.y, uSweep.x);
    float L = uSweep.x + uA * uSweep.y, Lp = abs(Dp.x) + uA * abs(Dp.y);
    vec2 S = vec2(dot(P - vec2(0.5, 0.5 * uA), uSweep) + 0.5 * L, dot(P - vec2(0.5, 0.5 * uA), Dp) + 0.5 * Lp);
    vec2 c = uLight.xy * vec2(L, Lp) + uDrift * L;
    vec2 d = S - c;
    float k = length(d / (uLight.zw * vec2(L, Lp)));
    float F = uLight2.x * L;
    float core = 1.0 - smoothstep(-F * 0.5, F * 0.5, length(d) * (1.0 - 1.0 / max(k, 1e-4)));
    float occ = clamp((uOcc - (1.0 - S.x / L)) / 1.5 + 0.5, 0.0, 1.0);
    float hot = 1.0 - clamp(length(d) / (uLight2.y * L), 0.0, 1.0);
    float lit = core * (0.5 + 0.5 * hot) * (1.0 - occ) * uLevel * uIntensity;
    // 먼지가 돌면서 빛을 받았다 놓쳤다 함
    float tw = 0.5 + 0.5 * sin(t * (0.7 + 1.9 * fract(s * 11.0)) + s * 60.0);
    float edge = smoothstep(0.0, 0.04, min(min(P.x, 1.0 - P.x), min(P.y, uA - P.y)));
    vA = lit * (0.2 + 0.8 * tw * tw) * edge * uOpacity;

    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_PointSize = max(1.5, (0.003 + 0.005 * fract(s * 5.3)) * uPx / -mv.z);
    gl_Position = projectionMatrix * mv;
  }
</script>
<script id="dustFrag" type="x-shader/x-fragment">
  precision highp float;
  varying float vA;
  void main() {
    float a = smoothstep(0.5, 0.05, length(gl_PointCoord - 0.5)) * vA * 0.75;
    gl_FragColor = vec4(1.0, 0.97, 0.9, a);       // 더하기 합성: 빛을 받은 먼지만 밝게 보임
  }
</script>

<script>
  // 보는 각도 -> 모션 시간 (AE 기준 초). 왼쪽·위 끝 = 시작(어둠), 정면 = 밝은 포스터, 오른쪽·아래 끝 = 끝(어둠 + 심볼)
  // 빛과 어둠은 보는 쪽에서 들어온다: 좌우로 비켜서면 가로로, 위아래로 비켜서면 세로로 지나감
  // 주소 옵션: ?max=30 (좌우로 어둠이 다 차는 각도, 기본 22) / ?vmax=25 (위아래, 기본 18) / ?flip=1 (좌우 반대)
  //            ?debug=1 (각도 눈금) / ?t=6.5 (시간 고정) / ?warm=0 (빛 경계 따뜻한 기운 끔)
  // 각도는 피드백 반영(2026-10-29): 크게 돌리지 않아도 끝까지 가도록 30°/25° -> 22°/18°
  const q = new URLSearchParams(location.search);
  const MAX_DEG = +q.get('max') || 22;
  const MAX_V = +q.get('vmax') || 18;             // 위아래는 움직일 수 있는 폭이 좁아서 조금 작게
  const FLIP = q.get('flip') === '1';
  const DEBUG = q.get('debug') === '1';
  const FIXED_T = q.has('t') ? +q.get('t') : null;
  const T_LEFT = 0.6, T_FRONT = 4.0, T_RIGHT = 7.6;
  const MAX_SPEED = 4.0;                          // 모션 시간 기준 초/초: 손떨림이나 인식 튐에도 장면이 확 바뀌지 않게

  // ---- AE 키프레임 (시간, 값, 나가는/들어오는 영향력 %) 그대로 ----
  function bezier(x1, x2) {                       // cubic-bezier(x1, 0, x2, 1)
    return (u) => {
      let s = u;
      for (let i = 0; i < 8; i++) {
        const x = 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s - u;
        const dx = 3 * (1 - s) * (1 - s) * x1 + 6 * (1 - s) * s * (x2 - x1) + 3 * s * s * (1 - x2);
        if (Math.abs(dx) < 1e-6) break;
        s = Math.min(1, Math.max(0, s - x / dx));
      }
      return 3 * (1 - s) * s * s + s * s * s;
    };
  }
  function key(t0, v0, t1, v1, outInf, inInf) {
    const e = bezier(outInf / 100, 1 - inInf / 100);
    return (t) => t <= t0 ? v0 : t >= t1 ? v1 : v0 + (v1 - v0) * e((t - t0) / (t1 - t0));
  }
  function points(pts) {                          // 실측 점 사이를 부드럽게 잇기
    return (t) => {
      if (t <= pts[0][0]) return pts[0][1];
      for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) {
        const [t0, v0] = pts[i - 1], [t1, v1] = pts[i], u = (t - t0) / (t1 - t0);
        return v0 + (v1 - v0) * u * u * (3 - 2 * u);

      return pts[pts.length - 1][1];
    };
  }
  const A = 3000 / 2120;
  const K = {
    // 빛 타원: 0.3초 왼쪽 바깥의 작은 점 -> 4초 포스터 전체 (이후 그대로)
    cx: key(0.3, -0.35, 4.0, -0.24, 30, 75),
    rx: key(0.3, 0.05, 4.0, 1.62, 30, 75),
    ry: key(0.3, 0.30, 4.0, 1.30, 30, 75),        // 지나가는 방향의 수직 길이 대비
    fe: key(0.3, 0.3, 4.0, 0.7, 30, 75),
    hot: key(0.3, 0.05, 4.0, 1.2, 30, 75),
    stretch: key(0.0, 1.0, 7.7, 1.7, 75, 25),
    soft: key(3.0, 0, 7.7, 0.02, 75, 25),
    dir: key(3.0, 0, 7.7, 0.035, 75, 25),
    // 가림 띠: AE 키(4.9~6.9초)는 이후 수정본에서 바뀌어서, 확정 영상의 열별 밝기로 맞춘 값
    occ: points([[5.6, -0.75], [5.9, 0.5], [6.1, 1.05], [6.4, 1.75]]),
    level: points([[6.3, 1], [6.5, 0.96], [6.7, 0.81], [6.9, 0.58], [7.2, 0.25], [7.5, 0.02], [7.6, 0]]),   // 마지막 암전 (영상 실측)
    symIn: key(5.85, 0, 6.15, 0.15, 50, 50),
    symTail: key(0.0, 0.15, 1.0, 0, 33, 50),
    symScale: key(5.85, 1, 7.3, 1.04, 33, 33),
    // 빛이 들어오는 동안: 막 닿은 곳의 그림자가 길고 흐리다가 3초쯤 제자리로 / 빛 세기도 82% -> 100%로 차오름
    settle: key(0.6, 1, 3.2, 0, 33, 60),

  const $ = (id) => document.getElementById(id);

  function setTime(t) {

  function buildMaterial() {
    return new Promise((resolve) => {

      const done = () => { if (++n === 2) resolve(); };
      const poster = loader.load('poster.jpg', done), symbol = loader.load('symbol.png', done);
      poster.minFilter = THREE.LinearMipmapLinearFilter; poster.generateMipmaps = true; poster.anisotropy = 4;

        vertexShader: $('motionVert').textContent,
        fragmentShader: $('motionFrag').textContent,
        transparent: true,
        uniforms: {
          uPoster: { value: poster }, uSymbol: { value: symbol },
          uTexSize: { value: new THREE.Vector2(2120, 3000) }, uA: { value: A },
          uLight: { value: new THREE.Vector4() }, uLight2: { value: new THREE.Vector2() }, uSweep: { value: new THREE.Vector2(1, 0) },
          uStretch: { value: 1 }, uSoft: { value: 0 }, uDir: { value: 0 }, uShear: { value: 0 }, uStretchMul: { value: 1 },
          uOcc: { value: -1 }, uSymEdge: { value: -1 }, uLevel: { value: 1 },
          uSymA: { value: 0 }, uTailA: { value: 0 }, uSymScale: { value: 1 },
          uAmbGain: { value: +q.get('amb') || 1 }, uOpacity: { value: 0 },
          uSettle: { value: 0 }, uIntensity: { value: 1 }, uDrift: { value: new THREE.Vector2() },
          uWarm: { value: q.has('warm') ? +q.get('warm') : 0.6 }, uM: { value: 0.06 },
        },
      });
      plane.getObject3D('mesh').material = mat;
      setTime(shownT);
    });
  }

  // 빛 속 먼지: 포스터 앞 공간에 260개. 빛·어둠 값은 모션 셰이더와 같은 uniform을 함께 써서 항상 같은 빛을 받는다
  let dust = null;
  function buildDust() {
    const N = matchMedia('(prefers-reduced-motion: reduce)').matches ? 90 : 260;
    const pos = new Float32Array(N * 3), seed = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      pos[i * 3] = Math.random() - 0.5;
      pos[i * 3 + 1] = (Math.random() - 0.5) * A;
      pos[i * 3 + 2] = 0.015 + 0.3 * Math.pow(Math.random(), 1.5);   // 벽 가까이에 더 많이
      seed[i] = Math.random();

      vertexShader: $('dustVert').textContent, fragmentShader: $('dustFrag').textContent,

        uLight: u.uLight, uLight2: u.uLight2, uSweep: u.uSweep, uDrift: u.uDrift,

  const loaded = new Promise((r) => scene.hasLoaded ? r() : scene.addEventListener('loaded', r, { once: true }))
    .then(buildMaterial)
    .then(buildDust)
    .then(() => {
      goAR.disabled = goWeb.disabled = false; goAR.textContent = 'AR로 보기';
      window.__motion = { setTime, scene, mat, dust };      // 확인용
    });

  function fadeTo(to, ms) {

      if (k < 1) fadeRaf = requestAnimationFrame(step);
    };
    fadeRaf = requestAnimationFrame(step);
  }

  // 좌우(왼쪽 = 시작, 오른쪽 = 끝)와 위아래(위 = 시작, 아래 = 끝)를 합친 진행 정도 -1 ~ 1.
  // 왼쪽 아래처럼 서로 반대인 대각선은 상쇄돼 밝은 쪽에 머문다
  function progress(h, v) { return Math.max(-1, Math.min(1, h / MAX_DEG + v / MAX_V)); }
  function timeFor(h, v) {
    const u = progress(h, v);
    return u < 0 ? T_FRONT + u * (T_FRONT - T_LEFT) : T_FRONT + u * (T_RIGHT - T_FRONT);
  }

  // AR: 포스터 기준 좌표에서 카메라 위치 -> 포스터 정면과 이루는 좌우 / 위아래 각도 (왼쪽, 위에서 보면 음수)
  const inv = new THREE.Matrix4(), camPos = new THREE.Vector3();
  function arAngle() {
    target.object3D.updateMatrixWorld(true);
    $('cam').object3D.getWorldPosition(camPos);
    camPos.applyMatrix4(inv.copy(target.object3D.matrixWorld).invert());
    return [Math.atan2(camPos.x, camPos.z) * 180 / Math.PI, -Math.atan2(camPos.y, camPos.z) * 180 / Math.PI];
  }

      setTime(shownT);
      // 가만히 있어도 살아 있는 빛: 세기는 ±2% 안에서 아주 느리게 숨 쉬고, 광원은 포스터 폭의 1% 안에서 흔들림
      const s = now / 1000;
      mat.uniforms.uIntensity.value *= 1 + 0.012 * Math.sin(s * 1.1) + 0.008 * Math.sin(s * 2.7 + 1);
      mat.uniforms.uDrift.value.set(0.008 * Math.sin(s * 0.37), 0.006 * Math.sin(s * 0.53 + 2));
      if (dust) {
        const du = dust.material.uniforms, cam = scene.camera;
        du.uTime.value = s;
        du.uPx.value = scene.renderer.domElement.height / (2 * Math.tan(cam.fov * Math.PI / 360));
        // 각도가 빨리 바뀐 만큼 공기가 흔들림 -> 천천히 가라앉음
        const kick = (x) => Math.max(-0.03, Math.min(0.03, x));
        du.uStir.value.x += (kick(-(ah - prevH) / Math.max(dt, 1e-3) * 0.0008) - du.uStir.value.x) * (1 - Math.exp(-dt * 3));
        du.uStir.value.y += (kick((av - prevV) / Math.max(dt, 1e-3) * 0.0008) - du.uStir.value.y) * (1 - Math.exp(-dt * 3));
      }
      prevH = ah; prevV = av;
      // 빛·어둠이 지나가는 방향: 좌우로 비켜서면 가로, 위아래면 세로, 비스듬히면 그 사이 (정면 근처는 가로)
      const sx = Math.abs(ah) / MAX_DEG + 0.02, sy = Math.abs(av) / MAX_V, n = Math.hypot(sx, sy);
      mat.uniforms.uSweep.value.set(sx / n, sy / n);
      // 그림자: 위에서 보면 아래로, 아래에서 보면 위로 기울고 (최대 약 19°), 옆으로 비켜설수록 조금 더 길어짐
      mat.uniforms.uShear.value = Math.max(-1, Math.min(1, -av / MAX_V)) * 0.35;
      mat.uniforms.uStretchMul.value = 1 + 0.15 * Math.min(1, Math.abs(ah) / MAX_DEG);
      if (mode === 'web') {                                                // 기울인 쪽으로 살짝 돌아 보임
        target.object3D.rotation.y = -ah * Math.PI / 180 * 0.2;
        target.object3D.rotation.x = -av * Math.PI / 180 * 0.2;
      }
      if (DEBUG) {
        $('meterVal').textContent = `좌우 ${ah.toFixed(0)}° · 위아래 ${av.toFixed(0)}° · ${shownT.toFixed(2)}s`;
        $('meterKnob').style.left = `calc(${(progress(ah, av) + 1) * 50}% - 1px)`;
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function onFound() {
    scan.hidden = true;
    pill.innerHTML = mode === 'ar' ? '<b>포스터 인식됨</b> · 좌우·위아래로 비켜서 보세요'
                                   : (usingTilt || matchMedia('(pointer: coarse)').matches ? '휴대폰을 좌우·앞뒤로 기울여 보세요' : '마우스를 좌우·위아래로 움직여 보세요');
    pill.hidden = false;
    if (!tracking && mode === 'ar') [ah, av] = arAngle();
    tracking = true;                               // 처음엔 어둠에서 지금 각도의 장면까지 빛이 번져 들어온다
    fadeTo(1, 350);
    setTimeout(() => { if (tracking) pill.hidden = true; }, 3000);
  }
  function onLost() {
    tracking = false; shownT = T_LEFT; vel = 0;
    fadeTo(0, 200);
    scan.hidden = false; pill.hidden = false;
    pill.textContent = '포스터 전체가 화면에 들어오게 비춰 주세요';
  }

  goAR.addEventListener('click', async () => {
    await loaded;
    mode = 'ar'; goAR.disabled = goWeb.disabled = true; goAR.textContent = '카메라 여는 중…';
    if (DEBUG) $('meter').hidden = false;
    try {
      await scene.systems['mindar-image-system'].start();
      document.documentElement.classList.add('running');
      start.hidden = true; scan.hidden = false; pill.hidden = false;
    } catch (e) {
      start.hidden = true; err.hidden = false;
      $('errMsg').textContent = (location.protocol !== 'https:' && location.hostname !== 'localhost')
        ? '카메라는 https 주소에서만 열립니다. https 링크로 다시 열거나 \'화면으로 보기\'를 눌러 주세요.'
        : '브라우저 설정에서 이 페이지의 카메라 권한을 허용한 뒤 새로고침해 주세요.';
    }
  });

  // 화면 보기: 카메라 없이 포스터를 화면 가득 띄움
  function fitPoster() {
    const cam = $('cam').getObject3D('camera');
    const fov = cam.fov * Math.PI / 180, aspect = innerWidth / innerHeight;
    const h = 1.4151 * 1.12, w = 1 * 1.12;                  // 여백 조금
    const d = Math.max(h / 2 / Math.tan(fov / 2), w / 2 / Math.tan(fov / 2) / aspect);
    target.object3D.position.set(0, 0, -d);
  }
  goWeb.addEventListener('click', async () => {
    await loaded;
    mode = 'web';
    document.documentElement.classList.add('web');
    // iOS는 기울기 센서를 쓰려면 버튼을 누를 때 허락을 받아야 한다
    try {
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
        if (await DeviceOrientationEvent.requestPermission() === 'granted') addEventListener('deviceorientation', onTilt);
      } else addEventListener('deviceorientation', onTilt);
    } catch (e) {}
    addEventListener('pointermove', onPointer); addEventListener('pointerdown', onPointer);
    addEventListener('resize', fitPoster);
    const o = target.object3D;
    o.matrixAutoUpdate = true; o.visible = true;
    fitPoster();
    start.hidden = true;
    if (DEBUG) $('meter').hidden = false;
    onFound();
  });

  target.addEventListener('targetFound', onFound);
  target.addEventListener('targetLost', onLost);
  scene.addEventListener('arError', () => { scan.hidden = true; pill.hidden = true; err.hidden = false; });
</script>
</body>
</html>
